<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل المواصلات العامة والتوجيه الذكي</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .main-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .app-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-header h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .app-header p {
      font-size: 0.88rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: #2563eb;
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
    }

    .suggestion-item:hover {
      background: #eff6ff;
      color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 10px;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      height: 88vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .modal-header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: #0f172a;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      color: #64748b;
    }

    .modal-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .route-details {
      width: 380px;
      padding: 20px;
      background: #f8fafc;
      border-left: 1px solid #e2e8f0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .summary-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .summary-item .label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .summary-item .value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #2563eb;
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-card {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      font-size: 0.88rem;
      color: #334155;
      line-height: 1.4;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 6px;
      color: #fff;
      font-size: 0.75rem;
      font-weight: bold;
      white-space: nowrap;
    }

    .bg-walk { background-color: #64748b; }
    .bg-metro { background-color: #dc2626; }
    .bg-bus { background-color: #d97706; }
    .bg-microbus { background-color: #0d9488; }

    #modalMap {
      flex: 1;
      height: 100%;
    }

    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      font-weight: bold;
      color: #2563eb;
    }

    @media (max-width: 768px) {
      .modal-body { flex-direction: column-reverse; }
      .route-details { width: 100%; height: 55%; border-left: none; border-top: 1px solid #e2e8f0; }
      #modalMap { height: 45%; }
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="app-header">
      <h1>دليل المواصلات العامة</h1>
      <p>اكتب اسم وجهتك لمعرفة الميكروباصات أو المترو أو الأتوبيس المناسب</p>
    </div>

    <div class="form-group">
      <label>نقطة الانطلاق</label>
      <input type="text" id="startInput" class="form-control" value="جاري تحديد موقعك..." readonly>
    </div>

    <div class="form-group">
      <label>أين تريد الذهاب؟</label>
      <input type="text" id="destinationInput" class="form-control" placeholder="مثال: عباس العقاد، رمسيس، مول العرب..." oninput="searchPlaces(this.value)">
      <div id="suggestionsBox" class="suggestions-box"></div>
    </div>

    <button class="btn-submit" onclick="openRouteModal()">خطّة المواصلات والتكلفة</button>
  </div>

  <div id="routeModal" class="modal-overlay">
    <div class="modal-content">
      <div id="loadingOverlay" class="loading-overlay">
        <div>جاري تحليل خطوط المواصلات والمسار...</div>
      </div>

      <div class="modal-header">
        <h3 id="modalTitle">تفاصيل خطة المواصلات</h3>
        <button class="close-btn" onclick="closeRouteModal()">✕</button>
      </div>

      <div class="modal-body">
        <div id="modalMap"></div>

        <div class="route-details">
          <div class="summary-box">
            <div class="summary-item">
              <div class="label">التكلفة المتوقعة</div>
              <div class="value" id="totalCost">-- ج.م</div>
            </div>
            <div class="summary-item">
              <div class="label">الوقت التقديري</div>
              <div class="value" id="totalTime">-- دقيقة</div>
            </div>
          </div>

          <h4 style="font-size: 0.9rem; color: #1e293b;">خطوات ركوب المواصلات:</h4>
          <div class="steps-list" id="stepsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = null;
    let userCoords = [30.0444, 31.2357]; // القاهرة
    let targetCoords = null;
    let targetName = "";
    let routeLayer = null;
    let markers = [];
    let searchDebounce = null;

    window.onload = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            document.getElementById('startInput').value = "تم تحديد موقعك الحالي (GPS) ✓";
          },
          () => {
            document.getElementById('startInput').value = "موقعي الحالي (ميدان التحرير، القاهرة)";
          }
        );
      }
    };

    function searchPlaces(query) {
      clearTimeout(searchDebounce);
      const box = document.getElementById('suggestionsBox');

      if (!query.trim() || query.length < 3) {
        box.style.display = 'none';
        return;
      }

      searchDebounce = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&limit=5&accept-language=ar`)
          .then(res => res.json())
          .then(data => {
            box.innerHTML = '';
            if (!data.length) { box.style.display = 'none'; return; }

            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = item.display_name;
              div.onclick = () => {
                document.getElementById('destinationInput').value = item.display_name.split(',')[0];
                targetCoords = [parseFloat(item.lat), parseFloat(item.lon)];
                targetName = item.display_name.split(',')[0];
                box.style.display = 'none';
              };
              box.appendChild(div);
            });
            box.style.display = 'block';
          })
          .catch(() => { box.style.display = 'none'; });
      }, 300);
    }

    async function generateTransitPlan() {
      showLoading(true);

      const url = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${targetCoords[1]},${targetCoords[0]}?overview=full&geometries=geojson`;

      let distanceKm = 0;
      let geometry = null;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.routes && data.routes.length > 0) {
          distanceKm = data.routes[0].distance / 1000;
          geometry = data.routes[0].geometry.coordinates;
        } else {
          throw new Error("Route calculation fallback");
        }
      } catch (e) {
        distanceKm = calculateDirectDistance(userCoords[0], userCoords[1], targetCoords[0], targetCoords[1]);
        geometry = [[userCoords[1], userCoords[0]], [targetCoords[1], targetCoords[0]]];
      }

      showLoading(false);
      buildTransitSteps(distanceKm);
      drawRouteOnMap(geometry);
    }

    function buildTransitSteps(dist) {
      const stepsContainer = document.getElementById('stepsContainer');
      stepsContainer.innerHTML = '';

      let cost = "";
      let time = "";
      let steps = [];

      if (dist < 1.5) {
        cost = "0 ج.م";
        time = `${Math.round(dist * 15)} دقيقة`;
        steps = [
          { badge: "مشي", class: "bg-walk", text: `المسافة قريبة جداً (${dist.toFixed(1)} كم)، يمكنك المشي مباشرة إلى ${targetName}.` }
        ];
      } else if (dist < 7) {
        cost = "7 - 10 ج.م";
        time = `${Math.round(dist * 3 + 10)} دقيقة`;
        steps = [
          { badge: "مشي", class: "bg-walk", text: "تمشَّ لأقرب محطة سيرفيس/ميكروباص من موقعك." },
          { badge: "ميكروباص", class: "bg-microbus", text: `اركب ميكروباص متجه نحو (${targetName}) أو أقرب محور رئيسي مجاور لها.` },
          { badge: "مشي", class: "bg-walk", text: `انزل عند أقرب نقطة وسِر نحو دقيقتين للوصول إلى ${targetName}.` }
        ];
      } else if (dist < 20) {
        cost = "12 - 18 ج.م";
        time = `${Math.round(dist * 2.2 + 15)} دقيقة`;
        steps = [
          { badge: "مشي", class: "bg-walk", text: "توجه إلى أقرب محطة مترو من موقعك الحالي." },
          { badge: "مترو", class: "bg-metro", text: "اركب المترو وانزل في أقرب محطة تبادلية تؤدي لمنطقتك." },
          { badge: "أتوبيس/سرفيس", class: "bg-bus", text: `من خارج محطة المترو، اركب ميكروباص أو أتوبيس هيئة النقل العام المتجه مباشرة إلى ${targetName}.` }
        ];
      } else {
        cost = "25 - 35 ج.م";
        time = `${Math.round(dist * 1.8 + 25)} دقيقة`;
        steps = [
          { badge: "مشي", class: "bg-walk", text: "توجه إلى موقف الأقاليم/الموقف الرئيسي القريب منك." },
          { badge: "ميكروباص سريع", class: "bg-microbus", text: `اركب ميكروباص (سريع/دائري) المتجه إلى منطقة ${targetName}.` },
          { badge: "سرفيس محلي", class: "bg-bus", text: "انزل عند المحور الرئيسي واستقل سرفيس داخلي للوصول للوجهة بالضبط." }
        ];
      }

      document.getElementById('totalCost').innerText = cost;
      document.getElementById('totalTime').innerText = time;

      steps.forEach(step => {
        const div = document.createElement('div');
        div.className = 'step-card';
        div.innerHTML = `
          <span class="badge ${step.class}">${step.badge}</span>
          <div>${step.text}</div>
        `;
        stepsContainer.appendChild(div);
      });
    }

    function calculateDirectDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function drawRouteOnMap(coordinates) {
      if (!map) {
        map = L.map('modalMap');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }

      setTimeout(() => {
        map.invalidateSize();

        markers.forEach(m => map.removeLayer(m));
        if (routeLayer) map.removeLayer(routeLayer);
        markers = [];

        const startM = L.marker(userCoords).addTo(map).bindPopup("نقطة الانطلاق").openPopup();
        const endM = L.marker(targetCoords).addTo(map).bindPopup(targetName);
        markers.push(startM, endM);

        const latLngs = coordinates.map(coord => [coord[1], coord[0]]);
        routeLayer = L.polyline(latLngs, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
      }, 200);
    }

    function openRouteModal() {
      const inputVal = document.getElementById('destinationInput').value.trim();
      if (!inputVal) { alert("يرجى كتابة مكان الوصول أولاً!"); return; }

      if (!targetCoords) {
        showLoading(true);
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputVal)}&countrycodes=eg&limit=1`)
          .then(res => res.json())
          .then(data => {
            if (data.length > 0) {
              targetCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
              targetName = data[0].display_name.split(',')[0];
              startRoutingProcess();
            } else {
              showLoading(false);
              alert("لم نتمكن من تحديد هذا المكان، يرجى اختيار اسم من القائمة.");
            }
          })
          .catch(() => {
            showLoading(false);
            alert("حدث خطأ في الاتصال بالشبكة.");
          });
      } else {
        startRoutingProcess();
      }
    }

    function startRoutingProcess() {
      document.getElementById('routeModal').style.display = 'flex';
      document.getElementById('modalTitle').innerText = `خطّة المواصلات إلى: ${targetName}`;
      generateTransitPlan();
    }

    function closeRouteModal() {
      document.getElementById('routeModal').style.display = 'none';
      targetCoords = null;
    }

    function showLoading(show) {
      document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
