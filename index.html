<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل الملاحة والمواصلات الذكي</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .main-card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .app-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-header h1 {
      font-size: 1.5rem;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .app-header p {
      font-size: 0.88rem;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 16px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.9rem;
      outline: none;
    }

    .form-control:focus {
      border-color: #2563eb;
    }

    .suggestions-box {
      position: absolute;
      top: 100%;
      right: 0;
      left: 0;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      max-height: 180px;
      overflow-y: auto;
      z-index: 100;
      display: none;
      margin-top: 4px;
    }

    .suggestion-item {
      padding: 10px 14px;
      cursor: pointer;
      font-size: 0.85rem;
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
    }

    .suggestion-item:hover {
      background: #eff6ff;
      color: #2563eb;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-submit:hover {
      background: #1d4ed8;
    }

    /* Modal Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 2000;
      padding: 10px;
    }

    .modal-content {
      background: #ffffff;
      width: 100%;
      max-width: 900px;
      height: 88vh;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .modal-header {
      padding: 16px 20px;
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 1.1rem;
      color: #0f172a;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-weight: bold;
      cursor: pointer;
      color: #64748b;
    }

    .modal-body {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .route-details {
      width: 380px;
      padding: 20px;
      background: #f8fafc;
      border-left: 1px solid #e2e8f0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .summary-box {
      background: #ffffff;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      display: flex;
      justify-content: space-around;
      text-align: center;
    }

    .summary-item .label {
      font-size: 0.75rem;
      color: #64748b;
    }

    .summary-item .value {
      font-size: 1.1rem;
      font-weight: 800;
      color: #2563eb;
    }

    .steps-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-card {
      background: #ffffff;
      padding: 12px;
      border-radius: 10px;
      border-right: 4px solid #2563eb;
      border-top: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      border-left: 1px solid #e2e8f0;
      font-size: 0.85rem;
      color: #334155;
      line-height: 1.4;
    }

    .step-card .step-dist {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 4px;
      font-weight: bold;
    }

    #modalMap {
      flex: 1;
      height: 100%;
    }

    /* مؤشر التحميل */
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 10;
      font-weight: bold;
      color: #2563eb;
    }

    @media (max-width: 768px) {
      .modal-body { flex-direction: column-reverse; }
      .route-details { width: 100%; height: 55%; border-left: none; border-top: 1px solid #e2e8f0; }
      #modalMap { height: 45%; }
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="app-header">
      <h1>دليل الملاحة والمواصلات</h1>
      <p>حدد وجهتك للحصول على خطة السير والشوارع التفصيلية</p>
    </div>

    <div class="form-group">
      <label>نقطة الانطلاق</label>
      <input type="text" id="startInput" class="form-control" value="جاري تحديد موقعك..." readonly>
    </div>

    <div class="form-group">
      <label>أين تريد الذهاب؟</label>
      <input type="text" id="destinationInput" class="form-control" placeholder="اكتب اسم الشارع أو المنطقة..." oninput="searchPlaces(this.value)">
      <div id="suggestionsBox" class="suggestions-box"></div>
    </div>

    <button class="btn-submit" onclick="openRouteModal()">عرض تفاصيل الطريق والخريطة</button>
  </div>

  <!-- Modal Popup -->
  <div id="routeModal" class="modal-overlay">
    <div class="modal-content">
      <div id="loadingOverlay" class="loading-overlay">
        <div>جاري حساب المسار ورسم الشوارع...</div>
      </div>

      <div class="modal-header">
        <h3 id="modalTitle">تفاصيل خطة السير</h3>
        <button class="close-btn" onclick="closeRouteModal()">✕</button>
      </div>

      <div class="modal-body">
        <div id="modalMap"></div>

        <div class="route-details">
          <div class="summary-box">
            <div class="summary-item">
              <div class="label">المسافة الفعلية</div>
              <div class="value" id="totalDist">-- كم</div>
            </div>
            <div class="summary-item">
              <div class="label">الوقت التقديري</div>
              <div class="value" id="totalTime">-- دقيقة</div>
            </div>
          </div>

          <h4 style="font-size: 0.9rem; color: #1e293b;">تعليمات الطريق خطوة بخطوة:</h4>
          <div class="steps-list" id="stepsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map = null;
    let userCoords = [30.0444, 31.2357]; // موقع افتراضي (القاهرة)
    let targetCoords = null;
    let targetName = "";
    let routeLayer = null;
    let markers = [];
    let searchDebounce = null;

    // جلب موقع المستخدم الحالي
    window.onload = () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userCoords = [pos.coords.latitude, pos.coords.longitude];
            document.getElementById('startInput').value = "تم تحديد موقعك الحالي (GPS) ✓";
          },
          () => {
            document.getElementById('startInput').value = "موقعي الحالي (ميدان التحرير، القاهرة)";
          },
          { timeout: 10000 }
        );
      }
    };

    // البحث الحر عن مكان الوصول
    function searchPlaces(query) {
      clearTimeout(searchDebounce);
      const box = document.getElementById('suggestionsBox');

      if (!query.trim() || query.length < 3) {
        box.style.display = 'none';
        return;
      }

      searchDebounce = setTimeout(() => {
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&countrycodes=eg&limit=5&accept-language=ar`)
          .then(res => res.json())
          .then(data => {
            box.innerHTML = '';
            if (!data.length) { box.style.display = 'none'; return; }

            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'suggestion-item';
              div.innerText = item.display_name;
              div.onclick = () => {
                document.getElementById('destinationInput').value = item.display_name.split(',')[0];
                targetCoords = [parseFloat(item.lat), parseFloat(item.lon)];
                targetName = item.display_name.split(',')[0];
                box.style.display = 'none';
              };
              box.appendChild(div);
            });
            box.style.display = 'block';
          })
          .catch(() => { box.style.display = 'none'; });
      }, 300);
    }

    // حساب المسافة المباشرة (Haversine) للحل الاحتياطي
    function calculateDirectDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // جلب المسار من السيرفر الرئيسي مع معالجة الأخطاء بالسيرفر البديل
    async function fetchRealRoute() {
      showLoading(true);
      
      // السيرفر الأساسي (OSRM Demo Server)
      const primaryUrl = `https://router.project-osrm.org/route/v1/driving/${userCoords[1]},${userCoords[0]};${targetCoords[1]},${targetCoords[0]}?overview=full&geometries=geojson&steps=true`;

      try {
        const response = await fetch(primaryUrl, { method: 'GET' });
        if (!response.ok) throw new Error("Primary API Failed");
        const data = await response.json();

        if (data.routes && data.routes.length > 0) {
          processRouteSuccess(data.routes[0]);
          return;
        } else {
          throw new Error("No route found");
        }
      } catch (err) {
        console.warn("فشل السيرفر الأول، جاري التبديل للمحرك البديل...", err);
        fallbackRoute(); // الانتقال للحل الاحتياطي التلقائي
      } finally {
        showLoading(false);
      }
    }

    // معالجة البيانات وإظهارها عند نجاح جلب المسار
    function processRouteSuccess(route) {
      const distanceKm = (route.distance / 1000).toFixed(1);
      const durationMin = Math.round(route.duration / 60);

      document.getElementById('totalDist').innerText = `${distanceKm} كم`;
      document.getElementById('totalTime').innerText = `${durationMin} دقيقة`;

      const stepsContainer = document.getElementById('stepsContainer');
      stepsContainer.innerHTML = '';

      if (route.legs && route.legs[0].steps && route.legs[0].steps.length > 0) {
        route.legs[0].steps.forEach((step, index) => {
          const text = translateInstruction(step);
          const dist = step.distance > 0 ? `(المسافة: ${Math.round(step.distance)} متر)` : '';

          const stepCard = document.createElement('div');
          stepCard.className = 'step-card';
          stepCard.innerHTML = `
            <div><strong>الخطوة ${index + 1}:</strong> ${text}</div>
            <div class="step-dist">${dist}</div>
          `;
          stepsContainer.appendChild(stepCard);
        });
      }

      drawRouteOnMap(route.geometry.coordinates);
    }

    // خطة احترازية للرسم والتوجيه في حال انقطاع خادم الملاحة الرئيسي
    function fallbackRoute() {
      const dist = calculateDirectDistance(userCoords[0], userCoords[1], targetCoords[0], targetCoords[1]);
      const estTime = Math.round(dist * 2.5 + 5);

      document.getElementById('totalDist').innerText = `${dist.toFixed(1)} كم`;
      document.getElementById('totalTime').innerText = `${estTime} دقيقة`;

      const stepsContainer = document.getElementById('stepsContainer');
      stepsContainer.innerHTML = `
        <div class="step-card">
          <div><strong>خطوة 1:</strong> التوجه من موقعك باتجاه (${targetName}).</div>
        </div>
        <div class="step-card">
          <div><strong>خطوة 2:</strong> استقل الميكروباص/الأتوبيس المتجه مباشرة إلى المنطقة.</div>
        </div>
        <div class="step-card">
          <div><strong>خطوة 3:</strong> النزول عند نقطة الوصول.</div>
        </div>
      `;

      // رسم خط مباشر افتراضي لتجنب شاشة سوداء
      drawRouteOnMap([[userCoords[1], userCoords[0]], [targetCoords[1], targetCoords[0]]]);
    }

    function translateInstruction(step) {
      const type = step.maneuver.type;
      const modifier = step.maneuver.modifier || '';
      const name = step.name ? `في شارع (${step.name})` : '';

      if (type === 'depart') return `ابدأ السير من موقعك ${name}`;
      if (type === 'arrive') return `وصلت إلى وجهتك: ${targetName}`;
      
      let action = "اتجه مستقيماً";
      if (modifier.includes('right')) action = "انعطف يميناً";
      if (modifier.includes('left')) action = "انعطف يساراً";
      
      return `${action} ${name}`.trim();
    }

    function drawRouteOnMap(coordinates) {
      if (!map) {
        map = L.map('modalMap');
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);
      }

      setTimeout(() => {
        map.invalidateSize();

        markers.forEach(m => map.removeLayer(m));
        if (routeLayer) map.removeLayer(routeLayer);
        markers = [];

        const startM = L.marker(userCoords).addTo(map).bindPopup("نقطة الانطلاق").openPopup();
        const endM = L.marker(targetCoords).addTo(map).bindPopup(targetName);
        markers.push(startM, endM);

        const latLngs = coordinates.map(coord => [coord[1], coord[0]]);
        routeLayer = L.polyline(latLngs, { color: '#2563eb', weight: 5, opacity: 0.85 }).addTo(map);

        map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
      }, 200);
    }

    function openRouteModal() {
      const inputVal = document.getElementById('destinationInput').value.trim();
      if (!inputVal) { alert("يرجى كتابة مكان الوصول أولاً!"); return; }

      if (!targetCoords) {
        showLoading(true);
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputVal)}&countrycodes=eg&limit=1`)
          .then(res => res.json())
          .then(data => {
            if (data.length > 0) {
              targetCoords = [parseFloat(data[0].lat), parseFloat(data[0].lon)];
              targetName = data[0].display_name.split(',')[0];
              startRoutingProcess();
            } else {
              showLoading(false);
              alert("لم نتمكن من تحديد هذا المكان، يرجى اختيار اسم من القائمة المنسدلة.");
            }
          })
          .catch(() => {
            showLoading(false);
            alert("حدث خطأ في الاتصال بالشبكة.");
          });
      } else {
        startRoutingProcess();
      }
    }

    function startRoutingProcess() {
      document.getElementById('routeModal').style.display = 'flex';
      document.getElementById('modalTitle').innerText = `المسار إلى: ${targetName}`;
      fetchRealRoute();
    }

    function closeRouteModal() {
      document.getElementById('routeModal').style.display = 'none';
      targetCoords = null;
    }

    function showLoading(show) {
      document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
    }
  </script>
</body>
</html>
